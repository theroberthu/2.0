<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2a32"/>

  <!-- Subtle geometric accents -->
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#2d7d9a" stroke-width="2" opacity="0.3"/>
  <line x1="80" y1="0" x2="80" y2="630" stroke="#2d7d9a" stroke-width="1" opacity="0.08"/>
  <line x1="1120" y1="0" x2="1120" y2="630" stroke="#2d7d9a" stroke-width="1" opacity="0.08"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#2d7d9a" opacity="0.6"/>

  <!-- Corner accents -->
  <rect x="60" y="50" width="40" height="3" fill="#2d7d9a" opacity="0.4"/>
  <rect x="60" y="50" width="3" height="30" fill="#2d7d9a" opacity="0.4"/>
  <rect x="1100" y="50" width="40" height="3" fill="#2d7d9a" opacity="0.4"/>
  <rect x="1137" y="50" width="3" height="30" fill="#2d7d9a" opacity="0.4"/>

  <!-- Owl logo placeholder circle -->
  <circle cx="600" cy="230" r="70" fill="#2d7d9a" opacity="0.12"/>
  <!-- Owl eyes -->
  <circle cx="580" cy="220" r="16" fill="#2d7d9a" opacity="0.3"/>
  <circle cx="620" cy="220" r="16" fill="#2d7d9a" opacity="0.3"/>
  <circle cx="580" cy="220" r="8" fill="#c5a94e" opacity="0.8"/>
  <circle cx="620" cy="220" r="8" fill="#c5a94e" opacity="0.8"/>
  <!-- Owl beak -->
  <polygon points="600,236 594,248 606,248" fill="#c5a94e" opacity="0.6"/>
  <!-- Owl ears -->
  <polygon points="560,180 570,200 550,200" fill="#2d7d9a" opacity="0.2"/>
  <polygon points="640,180 630,200 650,200" fill="#2d7d9a" opacity="0.2"/>

  <!-- Name -->
  <text x="600" y="360" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="48" font-weight="700" fill="#f7f9fb">Robert Hu</text>

  <!-- Title -->
  <text x="600" y="410" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#2d7d9a" letter-spacing="4">E-COMMERCE STRATEGIST</text>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="16" fill="#8a9aa2">Helping $100K-$2M brands grow with AI-powered strategies</text>

  <!-- Website -->
  <text x="600" y="600" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a9aa2" opacity="0.5">theroberthu.com</text>
</svg>
