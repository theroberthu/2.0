<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Illustration of a product graph. One generic product, Wireless Headphones Model X, is linked to three unbranded retailer offers by identity relationships, to its predecessor, Model W, by a predecessor relationship, and to two compatible accessories, a carrying case and replacement ear cushions, by compatibility relationships.">
