<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2a32"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#2d7d9a" opacity="0.6"/>

  <!-- Panel divider -->
  <line x1="610" y1="60" x2="610" y2="570" stroke="#2d7d9a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="72" y="60" width="4" height="510" rx="2" fill="#2d7d9a" opacity="0.3"/>

  <!-- LEFT PANEL ============================================== -->

  <!-- Category badge -->
  <rect x="88" y="72" width="220" height="28" rx="4" fill="#2d7d9a" opacity="0.2"/>
  <text x="198" y="91" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d7d9a" text-anchor="middle" letter-spacing="2">DIGITAL TRANSFORMATION</text>

  <!-- Headline -->
  <text x="88" y="245" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Meta&#8217;s Instagram</text>
  <text x="88" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#42a5c8" letter-spacing="-1">Shopping Agent.</text>

  <!-- Divider -->
  <line x1="88" y1="383" x2="570" y2="383" stroke="#2d7d9a" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Author -->
  <text x="88" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2d7d9a" font-weight="600" letter-spacing="1">ROBERT HU</text>
  <text x="88" y="443" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a6a7a">theroberthu.com</text>

  <!-- RIGHT PANEL: pulled quote ================================ -->

  <!-- Oversized decorative opening quote mark -->
  <text x="640" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" fill="#c5a94e" opacity="0.18">&#8220;</text>

  <!-- Pull quote in large gold italic -->
  <text x="660" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">Different reading</text>
  <text x="660" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">engine, same</text>
  <text x="660" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">selection logic.</text>

  <!-- Closing quote mark trailing the final line -->
  <text x="985" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" font-weight="500" fill="#c5a94e" opacity="0.5" letter-spacing="-0.5">&#8221;</text>

  <!-- Divider under quote -->
  <line x1="660" y1="430" x2="900" y2="430" stroke="#c5a94e" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Attribution -->
  <text x="660" y="465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#8a9aa2" letter-spacing="2.5">ROBERT HU &#183; ON THE WALMART PRECEDENT</text>

  <!-- HU mark bottom right -->
  <text x="1150" y="605" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#8a9aa2" opacity="0.5">HU</text>
</svg>
