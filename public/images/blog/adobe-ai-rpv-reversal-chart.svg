<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#0B0E17"/>

  <!-- Top accent -->
  <line x1="0" y1="4" x2="1200" y2="4" stroke="#D4A843" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Title -->
  <text x="80" y="88" font-family="'Big Shoulders', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">AI-Driven Revenue Per Visit vs Non-AI Traffic</text>
  <!-- Subtitle -->
  <text x="80" y="122" font-size="18" font-weight="500" fill="#8a9aa2" letter-spacing="0.3">March 2025 to March 2026</text>

  <!-- Chart area: y=180 (top) to y=640 (bottom). Zero baseline at y=400 -->
  <!-- Scale: 40% = 60px vertical. Max positive space = 220px (from 400 up to 180) = 146%. -->
  <!-- Max negative space = 240px (from 400 down to 640) = 160%. -->

  <!-- Zero baseline -->
  <line x1="120" y1="400" x2="1080" y2="400" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Horizontal guidelines + Y-axis labels -->
  <line x1="120" y1="280" x2="1080" y2="280" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="340" x2="1080" y2="340" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="460" x2="1080" y2="460" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="520" x2="1080" y2="520" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="580" x2="1080" y2="580" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="104" y="286" font-size="12" fill="#8a9aa2" text-anchor="end">+80%</text>
  <text x="104" y="346" font-size="12" fill="#8a9aa2" text-anchor="end">+40%</text>
  <text x="104" y="406" font-size="13" font-weight="600" fill="#8a9aa2" text-anchor="end" letter-spacing="1">0%</text>
  <text x="104" y="466" font-size="12" fill="#8a9aa2" text-anchor="end">-40%</text>
  <text x="104" y="526" font-size="12" fill="#8a9aa2" text-anchor="end">-80%</text>
  <text x="104" y="586" font-size="12" fill="#8a9aa2" text-anchor="end">-120%</text>

  <!-- BAR 1: March 2025 (-128%, muted red) -->
  <!-- -128% = 400 + (128/40)*60 = 400 + 192 = 592 -->
  <rect x="260" y="400" width="280" height="192" fill="#c94e4e" fill-opacity="0.85" rx="4"/>
  <!-- Value label ABOVE bar so it doesn't overlap source caption -->
  <text x="400" y="380" font-family="'Big Shoulders', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#c94e4e" text-anchor="middle" letter-spacing="-1">-128%</text>
  <!-- Category label INSIDE bar -->
  <text x="400" y="625" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2" fill-opacity="0.95">MARCH 2025</text>
  <text x="400" y="645" font-size="13" fill="#ffffff" text-anchor="middle" fill-opacity="0.75">AI losing to non-AI</text>

  <!-- BAR 2: March 2026 (+37%, gold) -->
  <!-- +37% = 400 - (37/40)*60 = 400 - 55.5 = 344.5 -->
  <rect x="660" y="345" width="280" height="55" fill="#D4A843" rx="4"/>
  <!-- Value label ABOVE bar -->
  <text x="800" y="320" font-family="'Big Shoulders', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#D4A843" text-anchor="middle" letter-spacing="-1">+37%</text>
  <!-- Category label BELOW bar -->
  <text x="800" y="428" font-size="14" font-weight="600" fill="#8a9aa2" text-anchor="middle" letter-spacing="2">MARCH 2026</text>
  <text x="800" y="448" font-size="13" fill="#D4A843" text-anchor="middle">AI winning vs non-AI</text>

  <!-- Source caption far below chart -->
  <text x="80" y="720" font-size="13" fill="#8a9aa2" letter-spacing="0.3">Source: Adobe Analytics Q1 2026 AI Traffic Report</text>

  <!-- HU mark -->
  <text x="1150" y="720" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#8a9aa2" opacity="0.5">HU</text>
</svg>
