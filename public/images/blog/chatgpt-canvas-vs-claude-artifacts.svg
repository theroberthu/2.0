  <!-- Left accent bar -->
  <rect x="72" y="60" width="4" height="510" rx="2" fill="#2d7d9a" opacity="0.3"/>

  <!-- Category badge -->
  <rect x="88" y="72" width="217" height="28" rx="4" fill="#2d7d9a" opacity="0.2"/>
