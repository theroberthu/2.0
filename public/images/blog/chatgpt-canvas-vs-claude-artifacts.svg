  <!-- Headline -->
  <text x="88" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">ChatGPT Canvas vs</text>
  <text x="88" y="208" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">Claude Artifacts:</text>
  <text x="88" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#2d7d9a" letter-spacing="-1">Which AI Tool Wins?</text>

  <!-- Divider -->
