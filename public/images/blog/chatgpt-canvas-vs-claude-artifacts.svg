  <text x="88" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8baab8">Two AI tools, two different use cases.</text>
  <text x="88" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8baab8">Here's the honest breakdown.</text>

  <!-- Author -->
  <text x="88" y="464" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2d7d9a" font-weight="600" letter-spacing="1">ROBERT HU</text>
  <text x="88" y="484" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a6a7a">theroberthu.com</text>

  <!-- Right panel box -->
  <rect x="625" y="90" width="530" height="450" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#2d7d9a" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Stats -->
  <text x="758" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#c5a94e" text-anchor="middle">2</text>
  <text x="758" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4a6a7a" text-anchor="middle" letter-spacing="2">TOOLS TESTED</text>
  <line x1="890" y1="285" x2="890" y2="400" stroke="#2d7d9a" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1023" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#c5a94e" text-anchor="middle">5x</text>
  <text x="1023" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4a6a7a" text-anchor="middle" letter-spacing="2">SPEED GAIN</text>

