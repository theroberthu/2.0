  <line x1="890" y1="285" x2="890" y2="400" stroke="#2d7d9a" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1023" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#c5a94e" text-anchor="middle">$25B</text>
