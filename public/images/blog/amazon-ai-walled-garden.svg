<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1e25;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b3a3a;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#8b3a3a;stop-opacity:0.08" />
    </linearGradient>
    <linearGradient id="openZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7d9a;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#2d7d9a;stop-opacity:0.08" />
    </linearGradient>
    <linearGradient id="centerCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7d9a;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1a6080;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="72" y="60" width="4" height="510" rx="2" fill="#2d7d9a" opacity="0.3"/>

  <!-- Category label -->
  <rect x="88" y="72" width="218" height="28" rx="4" fill="#2d7d9a" opacity="0.2"/>
  <text x="197" y="91" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d7d9a" text-anchor="middle" letter-spacing="2">E-COMMERCE STRATEGY</text>

  <!-- Main headline -->
  <text x="88" y="168" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">Amazon Blocked</text>
  <text x="88" y="224" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">One AI Agent and</text>
  <text x="88" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#2d7d9a" letter-spacing="-1">Invited Millions More.</text>

  <!-- Divider -->
  <line x1="88" y1="312" x2="580" y2="312" stroke="#2d7d9a" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Subtext -->
  <text x="88" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8baab8">Two moves. Same week. One strategy.</text>
  <text x="88" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#5a7a8a">Amazon controls who shops on Amazon,</text>
  <text x="88" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#5a7a8a">and which AI agents do the shopping.</text>

  <!-- Author -->
  <text x="88" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2d7d9a" font-weight="600" letter-spacing="1">ROBERT HU</text>
  <text x="88" y="482" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a6a7a">theroberthu.com</text>

  <!-- Right panel background -->
  <rect x="695" y="90" width="450" height="450" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#2d7d9a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Panel title -->
  <text x="920" y="126" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4a6a7a" text-anchor="middle" letter-spacing="2">AMAZON'S AI COMMERCE STRATEGY</text>

  <!-- BLOCKED zone (left of right panel) -->
  <rect x="710" y="148" width="180" height="200" rx="6" fill="url(#blockZone)" stroke="#8b3a3a" stroke-opacity="0.4" stroke-width="1"/>
  <text x="800" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#c07070" text-anchor="middle" letter-spacing="2">BLOCKED</text>
  <!-- X symbol -->
  <circle cx="800" cy="218" r="22" fill="#8b3a3a" fill-opacity="0.25" stroke="#8b3a3a" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="789" y1="207" x2="811" y2="229" stroke="#c07070" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="811" y1="207" x2="789" y2="229" stroke="#c07070" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Blocked label -->
  <text x="800" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c07070" text-anchor="middle" font-weight="700">Perplexity Comet</text>
  <text x="800" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7a5050" text-anchor="middle">External AI agents</text>
  <text x="800" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7a5050" text-anchor="middle">shopping autonomously</text>
  <text x="800" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6a4040" text-anchor="middle" font-style="italic">Fake ad impressions risk</text>

  <!-- Center Core: Amazon -->
  <rect x="900" y="178" width="80" height="80" rx="8" fill="url(#centerCore)" stroke="#2d7d9a" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="940" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#a0c8d8" text-anchor="middle" letter-spacing="1">AMAZON</text>
  <text x="940" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2d7d9a" text-anchor="middle">CONTROLS</text>
  <text x="940" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#5a8aaa" text-anchor="middle">Rufus · Buy for Me</text>

  <!-- INVITED zone (right of right panel) -->
  <rect x="990" y="148" width="148" height="200" rx="6" fill="url(#openZone)" stroke="#2d7d9a" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1064" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d9a7a" text-anchor="middle" letter-spacing="2">INVITED</text>
  <!-- Check symbol -->
  <circle cx="1064" cy="218" r="22" fill="#2d7d9a" fill-opacity="0.25" stroke="#2d9a7a" stroke-opacity="0.5" stroke-width="1.5"/>
  <polyline points="1050,218 1060,228 1078,208" fill="none" stroke="#2d9a7a" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Invited label -->
  <text x="1064" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2d9a7a" text-anchor="middle" font-weight="700">Shop Direct</text>
  <text x="1064" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3a7a6a" text-anchor="middle">400K+ merchants</text>
  <text x="1064" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#3a7a6a" text-anchor="middle">syncing DTC catalogs</text>
  <text x="1064" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#2a6a5a" text-anchor="middle" font-style="italic">On Amazon's terms</text>

  <!-- Bottom message -->
  <line x1="710" y1="378" x2="1138" y2="378" stroke="#2d7d9a" stroke-opacity="0.15" stroke-width="1"/>
  <text x="924" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2d7d9a" text-anchor="middle" font-weight="600">One AI agent matters inside Amazon's marketplace:</text>
  <text x="924" y="432" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c5a94e" text-anchor="middle" font-weight="700">RUFUS</text>
  <text x="924" y="455" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4a6a7a" text-anchor="middle" letter-spacing="1">CLEAN PRODUCT DATA IS THE CURRENCY IN BOTH CHANNELS</text>
</svg>
