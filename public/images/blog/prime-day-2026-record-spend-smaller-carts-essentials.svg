<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a2a32"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#2d7d9a" opacity="0.6"/>

  <!-- Panel divider -->
  <line x1="610" y1="60" x2="610" y2="570" stroke="#2d7d9a" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="72" y="60" width="4" height="510" rx="2" fill="#2d7d9a" opacity="0.3"/>

  <!-- LEFT PANEL ============================================== -->

  <!-- Category badge -->
  <rect x="88" y="72" width="135" height="28" rx="4" fill="#2d7d9a" opacity="0.2"/>
  <text x="155" y="91" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#2d7d9a" text-anchor="middle" letter-spacing="2">PRIME DAY 2026</text>

  <!-- Headline (2 lines) -->
  <text x="88" y="235" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Record Day,</text>
  <text x="88" y="299" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#42a5c8" letter-spacing="-1">Smaller Carts.</text>

  <!-- Divider -->
  <line x1="88" y1="397" x2="570" y2="397" stroke="#2d7d9a" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Author -->
  <text x="88" y="437" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2d7d9a" font-weight="600" letter-spacing="1">ROBERT HU</text>
  <text x="88" y="457" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#4a6a7a">theroberthu.com</text>

  <!-- RIGHT PANEL: pulled quote ================================ -->

  <!-- Oversized decorative opening quote mark -->
  <text x="640" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" fill="#c5a94e" opacity="0.18">&#8220;</text>

  <!-- Pull quote in gold italic, 5 lines at 30px -->
  <text x="660" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">People did not skip</text>
  <text x="660" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">Prime Day. They came</text>
  <text x="660" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">for the restock and</text>
  <text x="660" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="500" fill="#c5a94e" letter-spacing="-0.5">skipped the splurge.</text>

  <!-- Closing quote mark trailing the final line -->
  <text x="942" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="500" fill="#c5a94e" opacity="0.5" letter-spacing="-0.5">&#8221;</text>

  <!-- Divider under quote -->
  <line x1="660" y1="382" x2="1050" y2="382" stroke="#c5a94e" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Attribution -->
  <text x="660" y="417" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#8a9aa2" letter-spacing="2.5">ROBERT HU &#183; ON PRIME DAY 2026</text>

  <!-- HU mark bottom right -->
  <text x="1150" y="605" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#8a9aa2" opacity="0.5">HU</text>
</svg>
